<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line makes the page fit phone screens properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShiftSwap – test page</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    #status { padding: 12px; border-radius: 8px; background: #eee; }
  </style>
</head>
<body>
  <!-- Temporary test page (SS-5). Masrur replaces this with the real login page. -->
  <h1>ShiftSwap</h1>
  <p>If you can read this, the Deno server is serving files from <code>www/</code>.</p>
  <p id="status">Checking the API…</p>

  <script>
    // Ask the server's test route and show the answer on the page.
    fetch("/api/health")
      .then((response) => response.json())
      .then((data) => {
        document.getElementById("status").textContent = "API says: " + data.message;
      })
      .catch(() => {
        document.getElementById("status").textContent = "API not reachable – is the server running?";
      });
  </script>
</body>
</html>
