<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShiftSwap - Log in</title>
  <!-- Bikram's shared styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- container centres the page; max-width keeps the login box narrow on a laptop -->
  <main class="container" style="max-width: 420px;">

    <h1 class="text-center">ShiftSwap</h1>
    <p class="text-muted text-center">Log in to see your shifts</p>

    <!-- card = white rounded box -->
    <section class="card">

      <!-- Next step: JavaScript finds this form by its id -->
      <form id="login-form">

        <!-- form-group adds the spacing under each label + input pair -->
        <div class="form-group">
          <!-- "for" matches the input's "id": tapping the label selects the box -->
          <label for="email">Email</label>
          <input type="email" id="email" name="email"
                 autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password" required>
        </div>

        <!-- "hidden" is Bikram's class that hides this. JavaScript removes it on a failed login.
             The red colour uses his --danger variable until he adds an error class. -->
        <p id="login-error" class="hidden" style="color: var(--danger);">
          Wrong email or password
        </p>

        <!-- Bikram's blue main button -->
        <button class="btn btn-primary" type="submit">Log in</button>
      </form>

    </section>
  </main>
</body>
</html>
