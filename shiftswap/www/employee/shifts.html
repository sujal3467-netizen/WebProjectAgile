<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShiftSwap - My Shifts</title>
  <!-- Bikram's shared styles, then the extra employee styles -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/employee.css">
</head>
<body>
  <nav class="navbar">
    <strong>ShiftSwap</strong>
    <div class="nav-links">
      <a href="/employee/shifts.html">My Shifts</a>
      <a href="/employee/open-shifts.html">Open Shifts</a>
      <a href="/employee/my-swaps.html">My Requests</a>
      <button id="logout-button" class="btn btn-secondary" type="button">Log out</button>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <div>
        <h1>My Shifts</h1>
        <p id="greeting" class="text-muted"></p>
      </div>
      <a class="btn btn-primary" href="/employee/request-swap.html">Offer a shift</a>
    </div>

    <!-- Filter bar: the choices go to the server as query parameters -->
    <form id="filter-form" class="card filter-bar">
      <div class="grid grid-2">
        <div class="form-group">
          <label for="filter-from">From</label>
          <input id="filter-from" type="date">
        </div>
        <div class="form-group">
          <label for="filter-to">To</label>
          <input id="filter-to" type="date">
        </div>
      </div>
      <div class="form-group">
        <label for="filter-position">Position</label>
        <input id="filter-position" type="text" placeholder="e.g. Barista" maxlength="50">
      </div>
      <div class="form-group">
        <label class="check-label"><input id="filter-past" type="checkbox"> Show past shifts</label>
      </div>
      <div class="flex">
        <button class="btn btn-primary" type="submit">Apply filters</button>
        <button id="clear-button" class="btn btn-secondary" type="button">Clear</button>
      </div>
    </form>

    <p id="shifts-error" class="error-text hidden"></p>
    <p id="loading-message" class="text-muted">Loading your shifts...</p>

    <div id="shifts-list"></div>

    <p id="result-count" class="text-muted hidden mb-3"></p>
    <div id="pager" class="pager hidden">
      <button id="prev-button" class="btn btn-secondary" type="button">Previous</button>
      <span id="page-label" class="text-muted"></span>
      <button id="next-button" class="btn btn-secondary" type="button">Next</button>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/employee/js/common.js"></script>
  <script src="/employee/js/shifts.js"></script>
</body>
</html>
