<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Requests – ShiftSwap</title>
  <!-- Bikram's shared styles, then the employee look (the same design as the manager pages) -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/employee.css">
</head>
<body class="employee">
  <!-- Sidebar on laptops, bottom tab bar on phones (the same look as the manager pages) -->
  <aside class="sidebar">
    <a class="brand" href="/employee/shifts.html">
      <span class="brand-mark">⇄</span>
      <span class="brand-text">ShiftSwap<small>Employee</small></span>
    </a>
    <nav class="side-nav" aria-label="Employee pages">
        <a href="/employee/shifts.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>My Shifts</span></a>
        <a href="/employee/open-shifts.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Open Shifts</span></a>
        <a href="/employee/my-swaps.html" class="active" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg><span>My Requests</span></a>
        <a href="/employee/request-swap.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Offer a shift</span></a>
    </nav>
    <div class="side-foot">
      <div class="me">
        <span class="avatar" id="me-avatar">–</span>
        <span class="me-text"><strong id="me-name">Employee</strong><small>Employee</small></span>
      </div>
      <button id="logout-button" class="side-logout" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Log out</span></button>
    </div>
  </aside>

  <div class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Swaps</p>
        <h1>My Requests</h1>
        <p class="hero-sub">Shifts you gave away or took, and what your manager decided.</p>
      </div>
      <div class="hero-actions"></div>
    </header>
    <main class="content">
      <form id="filter-form" class="toolbar">
        <div class="filter-bar">
          <label class="field"><span>Status</span><select id="filter-status">
            <option value="">All</option>
            <option value="pending">Pending</option>
            <option value="accepted">Accepted</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
            <option value="cancelled">Cancelled</option>
          </select></label>
          <label class="field"><span>Which requests</span><select id="filter-side">
            <option value="">All</option>
            <option value="given">Shifts I gave away</option>
            <option value="taken">Shifts I took</option>
          </select></label>
          <label class="field"><span>From</span><input id="filter-from" type="date"></label>
          <label class="field"><span>To</span><input id="filter-to" type="date"></label>
        </div>
        <div class="filter-buttons">
          <button class="btn btn-primary" type="submit">Apply filters</button>
          <button id="clear-button" class="btn btn-secondary" type="button">Clear</button>
        </div>
      </form>

      <p id="swaps-error" class="message message-error hidden"></p>
      <p id="swaps-success" class="message message-success hidden"></p>
      <p id="loading-message" class="loading">Loading your requests...</p>

      <section class="panel">
        <div id="swaps-list" class="timeline"></div>
      </section>

      <p id="result-count" class="result-count hidden"></p>
      <div id="pager" class="pager hidden">
        <button id="prev-button" class="btn btn-secondary" type="button">Previous</button>
        <span id="page-label" class="muted"></span>
        <button id="next-button" class="btn btn-secondary" type="button">Next</button>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/employee/js/shell.js"></script>
  <script src="/employee/js/common.js"></script>
  <script src="/employee/js/my-swaps.js"></script>
</body>
</html>
