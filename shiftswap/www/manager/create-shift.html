<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Shift – ShiftSwap Manager</title>
  <!-- Bikram's shared styles first, then the extra manager styles -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/manager/manager.css" />
</head>
<body>
  <!-- Navbar: the same layout as the employee pages, from Bikram's style guide (SS-65) -->
  <nav class="navbar">
    <strong>ShiftSwap <span class="nav-role">Manager</span></strong>
    <div class="nav-links">
      <a href="/manager/dashboard.html">Dashboard</a>
      <a href="/manager/rota.html" class="active" aria-current="page">Rota</a>
      <a href="/manager/swaps.html">Approvals</a>
      <a href="/manager/staff.html">Staff</a>
      <a href="/notifications.html" title="Notifications" aria-label="Notifications">🔔</a>
      <button id="logout-button" class="btn btn-secondary" type="button">Log out</button>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <div>
        <h1>Create Shift</h1>
        <p class="text-muted">Add a shift to the rota or leave it open for anyone</p>
      </div>
      <a href="rota.html" class="btn btn-secondary">Back to rota</a>
    </div>
    <div id="message" hidden></div>

    <form id="shift-form" class="card" novalidate>
      <div class="form-group">
        <label for="shift-date">Date</label>
        <input type="date" id="shift-date" class="input" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="start-time">Start</label>
          <input type="time" id="start-time" class="input" required />
        </div>
        <div class="form-group">
          <label for="end-time">End</label>
          <input type="time" id="end-time" class="input" required />
        </div>
      </div>

      <div class="form-group">
        <label for="position">Position</label>
        <select id="position" class="input" required>
          <option value="">Choose a position</option>
          <option>Barista</option>
          <option>Till</option>
          <option>Stock</option>
          <option>Kitchen</option>
          <option>Cleaner</option>
          <option>Supervisor</option>
        </select>
      </div>

      <div class="form-group">
        <label for="employee">Employee</label>
        <select id="employee" class="input">
          <option value="">Leave open (anyone can take it)</option>
        </select>
      </div>

      <p id="shift-length" class="card-sub"></p>

      <button type="submit" id="save-button" class="btn btn-primary btn-block">Save shift</button>
    </form>

  </main>

  <!-- Order matters: api.js, then sample data, then shared code, then this page -->
  <script src="/js/api.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/manager-common.js"></script>
  <script src="js/create-shift.js"></script>
</body>
</html>
