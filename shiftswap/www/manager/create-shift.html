<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Shift – ShiftSwap Manager</title>
  <!-- Bikram's shared styles first (colours, buttons, forms), then the manager look -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/manager/manager.css" />
</head>
<body class="manager">
  <!-- Sidebar on laptops, bottom tab bar on phones (manager.css) -->
  <aside class="sidebar no-print">
    <a class="brand" href="/manager/dashboard.html">
      <span class="brand-mark">⇄</span>
      <span class="brand-text">ShiftSwap<small>Manager</small></span>
    </a>
    <nav class="side-nav" aria-label="Manager pages">
        <a href="/manager/dashboard.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Dashboard</span></a>
        <a href="/manager/rota.html" class="active" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Rota</span></a>
        <a href="/manager/swaps.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg><span>Approvals</span> <span class="nav-badge" data-swap-count hidden></span></a>
        <a href="/manager/staff.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a7 7 0 0 1 14 0v1M16 3.5a4 4 0 0 1 0 8M22 21v-1a6 6 0 0 0-4-5.7"/></svg><span>Staff</span></a>
        <a href="/notifications.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>Alerts</span></a>
    </nav>
    <div class="side-foot">
      <div class="me">
        <span class="avatar" id="me-avatar">–</span>
        <span class="me-text"><strong id="me-name">Manager</strong><small>Manager</small></span>
      </div>
      <button id="logout-button" class="side-logout" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Log out</span></button>
    </div>
  </aside>

  <div class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Planning</p>
        <h1>Create Shift</h1>
        <p class="hero-sub">Add a shift to the rota or leave it open for anyone</p>
      </div>
      <div class="hero-actions no-print"><a href="rota.html" class="btn btn-ghost">← Back to rota</a></div>
    </header>

    <main class="content">
      <div id="message" hidden></div>
      <div class="form-layout">
        <form id="shift-form" class="panel" novalidate>
          <div class="form-group">
            <label for="shift-date">Date</label>
            <input type="date" id="shift-date" class="input" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="start-time">Start</label>
              <input type="time" id="start-time" class="input" required />
            </div>
            <div class="form-group">
              <label for="end-time">End</label>
              <input type="time" id="end-time" class="input" required />
            </div>
          </div>

          <div class="form-group">
            <label for="position">Position</label>
            <select id="position" class="input" required>
              <option value="">Choose a position</option>
              <option>Barista</option>
              <option>Till</option>
              <option>Stock</option>
              <option>Kitchen</option>
              <option>Cleaner</option>
              <option>Supervisor</option>
            </select>
          </div>

          <div class="form-group">
            <label for="employee">Employee</label>
            <select id="employee" class="input">
              <option value="">Leave open (anyone can take it)</option>
            </select>
          </div>

          <p id="shift-length" class="card-sub"></p>

          <button type="submit" id="save-button" class="btn btn-primary btn-block">Save shift</button>
        </form>

        <!-- Live preview: shows the shift as it will look on the rota -->
        <aside class="preview">
          <p class="eyebrow">Preview</p>
          <div id="preview-card" class="shift pos-none">
            <div class="shift-time">--:-- – --:--</div>
            <div class="shift-pos">Choose a position</div>
            <div class="shift-who"><span class="tag tag-open">Open</span></div>
          </div>
          <p id="preview-date" class="card-sub">No date yet</p>
        </aside>
      </div>
    </main>
  </div>

  <!-- Order matters: api.js, then sample data, then shared code, then this page -->
  <script src="/js/api.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/manager-common.js"></script>
  <script src="js/create-shift.js"></script>
</body>
</html>
