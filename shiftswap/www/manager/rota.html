<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Rota – ShiftSwap Manager</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <!-- Top bar: page title and the notifications bell (Bikram's page) -->
  <header class="top-bar">
    <h1>Weekly Rota</h1>
    <a href="../notifications.html" title="Notifications">🔔</a>
  </header>

  <!-- Manager tabs: phone = bottom bar, laptop = under the header -->
  <nav class="tab-bar">
    <a href="dashboard.html"><span>🏠</span>Dashboard</a>
    <a href="rota.html" class="active"><span>📅</span>Rota</a>
    <a href="swaps.html"><span>✅</span>Approvals</a>
    <a href="staff.html"><span>👥</span>Staff</a>
  </nav>

  <main class="page">
    <div id="message" hidden></div>

    <!-- Move between weeks -->
    <div class="card week-picker">
      <button id="prev-week" class="btn btn-secondary btn-small no-print">◀ Prev</button>
      <strong id="week-label">This week</strong>
      <button id="next-week" class="btn btn-secondary btn-small no-print">Next ▶</button>
    </div>

    <div class="btn-group no-print" style="margin-bottom:12px">
      <a href="create-shift.html" class="btn btn-primary" style="flex:1">+ Create shift</a>
      <button id="print-button" class="btn btn-secondary">🖨 Print</button>
    </div>

    <!-- One section per day, filled in by rota.js -->
    <div id="rota"><p class="loading">Loading…</p></div>
  </main>

  <!-- Order matters: api.js, then sample data, then shared code, then this page -->
  <script src="../js/api.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/manager-common.js"></script>
  <script src="js/rota.js"></script>
</body>
</html>
