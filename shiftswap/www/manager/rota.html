<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Rota – ShiftSwap Manager</title>
  <!-- Bikram's shared styles first, then the extra manager styles -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/manager/manager.css" />
</head>
<body>
  <!-- Navbar: the same layout as the employee pages, from Bikram's style guide (SS-65) -->
  <nav class="navbar">
    <strong>ShiftSwap <span class="nav-role">Manager</span></strong>
    <div class="nav-links">
      <a href="/manager/dashboard.html">Dashboard</a>
      <a href="/manager/rota.html" class="active" aria-current="page">Rota</a>
      <a href="/manager/swaps.html">Approvals</a>
      <a href="/manager/staff.html">Staff</a>
      <a href="/notifications.html" title="Notifications" aria-label="Notifications">🔔</a>
      <button id="logout-button" class="btn btn-secondary" type="button">Log out</button>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <div>
        <h1>Weekly Rota</h1>
        <p class="text-muted">Every shift from Monday to Sunday</p>
      </div>
      <div class="flex no-print"><button id="print-button" class="btn btn-secondary" type="button">Print</button><a href="create-shift.html" class="btn btn-primary">+ Create shift</a></div>
    </div>
    <div id="message" hidden></div>

    <!-- Move between weeks -->
    <div class="card week-picker">
      <button id="prev-week" class="btn btn-secondary btn-small no-print">◀ Prev</button>
      <strong id="week-label">This week</strong>
      <button id="next-week" class="btn btn-secondary btn-small no-print">Next ▶</button>
    </div>

    <!-- Filter bar (SS-62). The choices are sent to the server (SS-57),
         so the rota stays fast even when there are lots of shifts. -->
    <form id="filter-form" class="card filter-bar no-print">
      <div class="grid grid-3">
        <div class="form-group">
          <label for="filter-employee">Employee</label>
          <select id="filter-employee">
            <option value="">All employees</option>
          </select>
        </div>
        <div class="form-group">
          <label for="filter-position">Position</label>
          <input id="filter-position" type="text" placeholder="e.g. Barista" maxlength="50" />
        </div>
        <div class="form-group">
          <label for="filter-status">Status</label>
          <select id="filter-status">
            <option value="">All shifts</option>
            <option value="assigned">Assigned</option>
            <option value="open">Open or up for swap</option>
          </select>
        </div>
      </div>
      <div class="flex">
        <button class="btn btn-primary" type="submit">Apply filters</button>
        <button id="clear-button" class="btn btn-secondary" type="button">Clear</button>
      </div>
    </form>

    <p id="result-count" class="text-muted"></p>

    <!-- One section per day, filled in by rota.js -->
    <div id="rota"><p class="loading">Loading…</p></div>
  </main>

  <!-- Order matters: api.js, then sample data, then shared code, then this page -->
  <script src="/js/api.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/manager-common.js"></script>
  <script src="js/rota.js"></script>
</body>
</html>
