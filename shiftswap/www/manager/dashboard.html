<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – ShiftSwap Manager</title>
  <!-- Bikram's shared styles first, then the extra manager styles -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/manager/manager.css" />
</head>
<body>
  <!-- Navbar: the same layout as the employee pages, from Bikram's style guide (SS-65) -->
  <nav class="navbar">
    <strong>ShiftSwap <span class="nav-role">Manager</span></strong>
    <div class="nav-links">
      <a href="/manager/dashboard.html" class="active" aria-current="page">Dashboard</a>
      <a href="/manager/rota.html">Rota</a>
      <a href="/manager/swaps.html">Approvals</a>
      <a href="/manager/staff.html">Staff</a>
      <a href="/notifications.html" title="Notifications" aria-label="Notifications">🔔</a>
      <button id="logout-button" class="btn btn-secondary" type="button">Log out</button>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <div>
        <h1>Dashboard</h1>
        <p class="text-muted">Today's shifts, gaps in the rota and swaps waiting for you</p>
      </div>
      <a href="create-shift.html" class="btn btn-primary">+ Create shift</a>
    </div>
    <div id="message" hidden></div>

    <p id="welcome" class="card-sub"></p>

    <!-- Three quick numbers -->
    <section class="stats">
      <div class="card stat">
        <div class="stat-number" id="stat-today">–</div>
        <div class="stat-label">Shifts today</div>
      </div>
      <div class="card stat">
        <div class="stat-number" id="stat-open">–</div>
        <div class="stat-label">Uncovered (7 days)</div>
      </div>
      <div class="card stat">
        <div class="stat-number" id="stat-swaps">–</div>
        <div class="stat-label">Swaps to approve</div>
      </div>
    </section>

    <!-- Warning appears only when shifts have nobody assigned -->
    <div id="uncovered-warning" class="message message-warning" hidden></div>


    <h2>Who's working today</h2>
    <div id="today-list"><p class="loading">Loading…</p></div>

    <h2>Uncovered shifts (next 7 days)</h2>
    <div id="open-list"><p class="loading">Loading…</p></div>
  </main>

  <!-- Order matters: api.js, then sample data, then shared code, then this page -->
  <script src="/js/api.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/manager-common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
